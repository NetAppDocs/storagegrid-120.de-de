indexpage:
  title: StorageGRID installieren, aktualisieren und Hotfixes anwenden
  summary: Ein StorageGRID System besteht aus einzelnen hardwarebasierten und softwarebasierten
    Knoten. Zunächst wird die Hardware für jeden Appliance-Knoten installiert und
    jeder Linux- oder VMware-Host konfiguriert. Anschließend wird die StorageGRID
    Software auf jedem Appliance- oder Software-Host installiert und die Knoten zu
    einem Grid verbunden.
