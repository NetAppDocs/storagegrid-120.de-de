---
indexpage:
  title: StorageGRID 12.0 Softwaredokumentation
  summary: NetApp StorageGRID ist eine softwaredefinierte Objektspeicherlösung, die
    ein breites Spektrum an Anwendungsfällen in öffentlichen, privaten und hybriden
    Multicloud-Umgebungen unterstützt. StorageGRID bietet native Unterstützung für
    die Amazon S3 API und liefert branchenführende Innovationen wie automatisiertes
    Lifecycle-Management, um unstrukturierte Daten kosteneffizient über lange Zeiträume
    zu speichern, zu sichern, zu schützen und zu bewahren.
